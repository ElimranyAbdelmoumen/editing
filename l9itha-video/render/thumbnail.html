<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>L9ITHA.Club — miniature</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1280px;height:720px;overflow:hidden;background:#FBF7EF}
  body{font-family:"Inter",sans-serif;color:#13224A;position:relative}
  .bg{position:absolute;inset:0;background:
    radial-gradient(520px 420px at 10% 15%, rgba(91,91,214,.18), transparent 60%),
    radial-gradient(520px 420px at 95% 95%, rgba(31,157,99,.16), transparent 60%), #FBF7EF}
  .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(19,34,74,.07) 1.4px, transparent 1.5px);background-size:30px 30px}
  .logo{position:absolute;left:64px;top:56px;width:260px;height:96px;border:3px dashed rgba(91,91,214,.55);border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:repeating-linear-gradient(135deg, rgba(91,91,214,.06) 0 16px, transparent 16px 32px),#F7F5FF;font:800 15px "Inter";letter-spacing:.12em;color:#5B5BD6;text-transform:uppercase}
  .name{position:absolute;left:64px;top:170px;font:900 44px "Inter Display";letter-spacing:-.01em}
  h1{position:absolute;left:64px;top:240px;width:700px;font:900 82px/1.0 "Inter Display";letter-spacing:-.025em}
  h1 em{font-style:normal;color:#5B5BD6}
  .tags{position:absolute;left:64px;bottom:60px;display:flex;gap:14px}
  .tags span{padding:10px 22px;border-radius:999px;font:800 24px "Inter Display";color:#fff}
  .card{position:absolute;right:56px;top:70px;width:440px;height:580px;background:#fff;border-radius:28px;box-shadow:0 30px 70px rgba(19,34,74,.2);transform:rotate(3deg);overflow:hidden}
  .code{position:absolute;left:0;right:0;top:0;height:170px;background:#111a33;padding:22px 26px;font:500 19px/1.55 "DejaVu Sans Mono",monospace;color:#E6EAF7;white-space:pre}
  .k{color:#B8A6FF}.s{color:#7EE2A8}.n{color:#FFC27A}.f{color:#7CB8FF}
</style>
</head>
<body>
<div class="bg"></div><div class="dots"></div>
<div class="logo">Logo officiel</div>
<div class="name">L9ITHA.Club</div>
<h1>Apprendre Python, <em>créer ses premières idées</em></h1>
<div class="tags"><span style="background:#1F9D63">Junior · 11–13 ans</span><span style="background:#2F6FEB">Pro · 14–17 ans</span></div>
<div class="card">
  <div class="code"><span class="k">for</span> i <span class="k">in</span> <span class="f">range</span>(<span class="n">36</span>):
    <span class="f">color</span>(couleurs[i % <span class="n">4</span>])
    <span class="f">forward</span>(<span class="n">220</span>)
    <span class="f">left</span>(<span class="n">170</span>)</div>
  <svg id="t" style="position:absolute;left:0;top:170px" width="440" height="410"></svg>
</div>
<script>
  const svg = document.getElementById("t"), W = 440, H = 410, C = ["#4B0082", "#008000", "#4169E1", "#FFA500"];
  let x = 0, y = 0, h = 0; const p = [[0, 0]];
  for (let i = 0; i < 36; i++){ x += 220 * Math.cos(h * Math.PI / 180); y += 220 * Math.sin(h * Math.PI / 180); p.push([x, y]); h += 170; }
  const xs = p.map(q => q[0]), ys = p.map(q => q[1]);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  const k = Math.min(W, H) * .86 / Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys));
  for (let i = 0; i < 36; i++){
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    l.setAttribute("x1", W / 2 + (p[i][0] - cx) * k); l.setAttribute("y1", H / 2 - (p[i][1] - cy) * k);
    l.setAttribute("x2", W / 2 + (p[i + 1][0] - cx) * k); l.setAttribute("y2", H / 2 - (p[i + 1][1] - cy) * k);
    l.setAttribute("stroke", C[i % 4]); l.setAttribute("stroke-width", 4); l.setAttribute("stroke-linecap", "round");
    svg.appendChild(l);
  }
</script>
</body>
</html>
